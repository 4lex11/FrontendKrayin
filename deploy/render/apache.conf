<VirtualHost *:10000>
    DocumentRoot /var/www/html/public
    # This container is served only behind Render's managed HTTPS endpoint.
    SetEnv HTTPS on
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>
    <LocationMatch "^/install">
        Require all denied
    </LocationMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
