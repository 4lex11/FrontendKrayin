[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:web]
command=apache2-foreground
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:churn]
command=bash -c 'while true; do php artisan churn:work --limit=5; sleep 10; done'
directory=/var/www/html
user=www-data
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=65
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
